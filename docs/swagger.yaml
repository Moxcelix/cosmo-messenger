definitions:
  controllers.deleteResponse:
    properties:
      message:
        type: string
    type: object
  controllers.infoResponse:
    properties:
      bio:
        type: string
      id:
        type: string
      name:
        type: string
      username:
        type: string
    type: object
  controllers.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  controllers.loginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  controllers.msgRequest:
    properties:
      content:
        type: string
      receiver_username:
        type: string
    required:
    - content
    - receiver_username
    type: object
  controllers.paginationMeta:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  controllers.refreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  controllers.refreshResponse:
    properties:
      access_token:
        type: string
    type: object
  controllers.registerRequest:
    properties:
      bio:
        type: string
      name:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - name
    - password
    - username
    type: object
  controllers.registerResponse:
    properties:
      message:
        type: string
    type: object
  controllers.sendRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  controllers.sendResponse:
    properties:
      message:
        $ref: '#/definitions/dto.ChatMessage'
      text:
        type: string
    type: object
  controllers.typingRequest:
    properties:
      chat_id:
        type: string
      is_typing:
        type: boolean
    type: object
  controllers.typingResponse:
    properties:
      message:
        type: string
    type: object
  controllers.usernameData:
    properties:
      id:
        type: string
      username:
        type: string
    type: object
  controllers.usernamesListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/controllers.usernameData'
        type: array
      meta:
        $ref: '#/definitions/controllers.paginationMeta'
    type: object
  controllers.validateRequest:
    properties:
      access_token:
        type: string
    type: object
  controllers.validateResponse:
    properties:
      username:
        type: string
    type: object
  dto.ChatCollection:
    properties:
      chats:
        items:
          $ref: '#/definitions/dto.ChatItem'
        type: array
      meta:
        $ref: '#/definitions/main_internal_application_chat_dto.ScrollingMeta'
    type: object
  dto.ChatItem:
    properties:
      id:
        type: string
      last_message:
        $ref: '#/definitions/dto.LastMessage'
      name:
        type: string
      type:
        type: string
    type: object
  dto.ChatMessage:
    properties:
      chat_id:
        type: string
      content:
        type: string
      edited:
        type: boolean
      id:
        type: string
      reply_to:
        $ref: '#/definitions/dto.Reply'
      sender:
        $ref: '#/definitions/dto.Sender'
      timestamp:
        type: string
    type: object
  dto.LastMessage:
    properties:
      content:
        type: string
      id:
        type: string
      is_replied:
        type: boolean
      sender:
        $ref: '#/definitions/dto.Sender'
      timestamp:
        type: string
    type: object
  dto.Reply:
    properties:
      content:
        type: string
      id:
        type: string
      sender:
        $ref: '#/definitions/dto.Sender'
    type: object
  dto.Sender:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  main_internal_application_chat_dto.ScrollingMeta:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      offset:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
  title: Cosmo Messenger API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user and returns JWT tokens
      parameters:
      - description: User credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.loginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Returns new access token by refresh token
      parameters:
      - description: Refresh credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.refreshResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User refresh token
      tags:
      - auth
  /api/v1/auth/validate:
    post:
      consumes:
      - application/json
      description: Returns userID if access token is valid
      parameters:
      - description: Access credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.validateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.validateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Validates users access token
      tags:
      - auth
  /api/v1/chats:
    get:
      consumes:
      - application/json
      description: Get paginated list of user's chats with cursor-based pagination
      parameters:
      - description: Cursor for pagination (chat ID)
        in: query
        name: cursor
        type: string
      - default: 10
        description: Number of chats per page
        in: query
        name: count
        type: integer
      - default: older
        description: 'Pagination direction: older or newer'
        enum:
        - older
        - newer
        in: query
        name: direction
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ChatCollection'
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user chats
      tags:
      - chats
  /api/v1/chats/{chat_id}:
    get:
      consumes:
      - application/json
      description: Get detailed information about a specific chat
      parameters:
      - description: Chat ID
        in: path
        name: chat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ChatItem'
        "400":
          description: Invalid chat ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Chat not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get specific chat
      tags:
      - chats
  /api/v1/chats/typing:
    post:
      consumes:
      - application/json
      description: Represents user typing
      parameters:
      - description: Typing data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.typingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.typingResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: User typing
      tags:
      - chats
  /api/v1/messages/chat/{chat_id}:
    get:
      consumes:
      - application/json
      description: Get paginated messages from a chat
      parameters:
      - description: Chat ID
        in: path
        name: chat_id
        required: true
        type: string
      - description: Cursor Message ID
        in: query
        name: cursor
        type: string
      - default: '"older"'
        description: Scrolling direction
        in: query
        name: dir
        type: string
      - default: 10
        description: Number of messages per page
        in: query
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied to chat
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Chat not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get chat messages
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: Send message
      parameters:
      - description: Chat ID
        in: path
        name: chat_id
        required: true
        type: string
      - description: Message data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.sendRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controllers.sendResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Message sending
      tags:
      - messages
  /api/v1/messages/direct:
    post:
      consumes:
      - application/json
      description: Send direct message
      parameters:
      - description: User data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.msgRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Message sending
      tags:
      - messages
  /api/v1/messages/direct/{username}:
    get:
      consumes:
      - application/json
      description: Get paginated messages from the direct
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Cursor Message ID
        in: query
        name: cursor
        type: string
      - default: '"older"'
        description: Scrolling direction
        in: query
        name: dir
        type: string
      - default: 10
        description: Number of messages per page
        in: query
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied to chat
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get direct messages
      tags:
      - messages
  /api/v1/users/delete:
    delete:
      consumes:
      - application/json
      description: Deletes the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.deleteResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete current user
      tags:
      - users
  /api/v1/users/delete/{user_id}:
    delete:
      consumes:
      - application/json
      description: Deletes a user by id. Admin access required.
      parameters:
      - description: Username of the user to delete
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.deleteResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user by id (Admin only)
      tags:
      - users
  /api/v1/users/find:
    get:
      description: Returns user by username for direct chating
      parameters:
      - description: Username
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Find user
      tags:
      - users
  /api/v1/users/get_info:
    get:
      description: Returns information about a user by username
      parameters:
      - description: Username
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.infoResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get info about user
      tags:
      - users
  /api/v1/users/get_usernames_list:
    get:
      consumes:
      - application/json
      description: Returns paginated usernames list
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.usernamesListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get usernames list
      tags:
      - users
  /api/v1/users/register:
    post:
      consumes:
      - application/json
      description: Creates a new user in system
      parameters:
      - description: User data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controllers.registerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User registration
      tags:
      - users
  /ws:
    get:
      description: WebSocket endpoint for real-time messaging
      responses: {}
      summary: WebSocket connection for real-time messages
      tags:
      - websocket
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
